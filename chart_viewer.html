<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chart Pattern Viewer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:      #070b10;
  --surface: #0d1520;
  --surface2:#121c28;
  --surface3:#172030;
  --border:  #1c2a3a;
  --border2: #253545;
  --text:    #d8eaf6;
  --muted:   #46647a;
  --muted2:  #7a9ab0;
  --green:   #26d96b;--green-d:#1a8c46;
  --red:     #f04a3a;
  --amber:   #f5c842;
  --blue:    #4da6ff;
  --violet:  #a07af0;
  --orange:  #f08048;
  --teal:    #28c9b0;
  --green-dim: rgba(38,217,107,.10);
  --red-dim:   rgba(240,74,58,.10);
  --amber-dim: rgba(245,200,66,.09);
  --blue-dim:  rgba(77,166,255,.09);
  --violet-dim:rgba(160,122,240,.09);
  --mono: 'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  --sans: 'Inter',system-ui,-apple-system,sans-serif;
}

body{background:var(--bg);color:var(--text);font-family:var(--sans);
     min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;
     -webkit-font-smoothing:antialiased}

/* ── TOP BAR ──────────────────────────────────────────────────────────────── */
.topbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:0 18px;
  display:flex;align-items:center;gap:10px;
  height:46px;position:sticky;top:0;z-index:200;flex-shrink:0;
}
.logo{
  display:flex;align-items:center;gap:8px;margin-right:4px;flex-shrink:0;
  padding-right:14px;border-right:1px solid var(--border);
}
.logo-icon{
  width:22px;height:22px;
  background:linear-gradient(135deg,var(--green-d),var(--green));
  border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:11px;flex-shrink:0;
}
.logo-text{
  font-family:var(--mono);font-size:12px;font-weight:700;
  color:var(--text);letter-spacing:.04em;white-space:nowrap;
}
.logo-sub{
  font-family:var(--sans);font-size:9px;font-weight:500;
  color:var(--muted);letter-spacing:.04em;margin-top:1px;
}
.market-grp{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px;flex-shrink:0}
.mtab{padding:3px 14px;border:none;border-radius:5px;background:transparent;
      color:var(--muted2);cursor:pointer;font-size:11px;font-weight:600;
      font-family:var(--sans);letter-spacing:.02em;transition:all .14s}
.mtab.active{background:var(--green);color:#040a06;font-weight:700}
.mtab:not(.active):hover{color:var(--text)}
.vsep{width:1px;background:var(--border);height:22px;flex-shrink:0}
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap svg{position:absolute;left:9px;color:var(--muted);pointer-events:none;flex-shrink:0}
#search-inp{
  background:var(--bg);border:1px solid var(--border);border-radius:7px;
  color:var(--text);padding:5px 10px 5px 30px;font-size:12px;
  font-family:var(--sans);width:154px;transition:all .15s;
}
#search-inp:focus{outline:none;border-color:var(--blue);width:210px;background:var(--surface2)}
#search-inp::placeholder{color:var(--muted)}
.sort-sel{
  background:var(--bg);border:1px solid var(--border);border-radius:7px;
  color:var(--muted2);padding:5px 10px;font-size:11px;font-family:var(--sans);
  cursor:pointer;transition:border-color .15s;
}
.sort-sel:focus{outline:none;border-color:var(--blue);color:var(--text)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.col-grp{display:flex;gap:2px;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:2px}
.col-btn{
  padding:3px 9px;border:none;border-radius:5px;background:transparent;
  color:var(--muted);cursor:pointer;font-size:11px;font-family:var(--mono);
  font-weight:600;transition:all .12s;
}
.col-btn.active{background:var(--surface3);color:var(--text)}
.col-btn:not(.active):hover{color:var(--muted2)}

/* ── APP LAYOUT ───────────────────────────────────────────────────────────── */
.app-body{display:flex;flex:1;min-height:0}

/* ── SIDEBAR ──────────────────────────────────────────────────────────────── */
.sidebar{
  width:228px;flex-shrink:0;
  background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-search{padding:10px 12px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-search input{
  width:100%;background:var(--bg);border:1px solid var(--border);
  border-radius:6px;color:var(--text);padding:5px 9px;
  font-size:11px;font-family:var(--sans);transition:border-color .15s;
}
.sidebar-search input::placeholder{color:var(--muted)}
.sidebar-search input:focus{outline:none;border-color:var(--blue);background:var(--surface2)}
.screen-list{flex:1;overflow-y:auto;padding:4px 0 12px}
.screen-list::-webkit-scrollbar{width:3px}
.screen-list::-webkit-scrollbar-track{background:transparent}
.screen-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.screen-group{
  padding:8px 14px 4px;font-size:9px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;
}
/* ── CCI panel ─────────────────────────────────────────────────────────────── */
.cci-panel{padding:8px 10px 10px;background:var(--surface2);margin:2px 6px;border-radius:8px;border:1px solid var(--border)}
.cci-panel-title{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;padding-left:2px}
.cci-tiles{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.cci-tile{
  background:var(--surface3);border:1px solid var(--border);border-radius:6px;
  padding:6px 8px;cursor:pointer;transition:all .12s;text-align:center;
}
.cci-tile:hover{border-color:var(--amber);background:var(--amber-dim)}
.cci-tile.active{border-color:var(--amber);background:var(--amber-dim)}
.cci-tile-mtf{grid-column:1/-1;background:rgba(245,200,66,.06)}
.cci-tile-mtf:hover,.cci-tile-mtf.active{background:var(--amber-dim)}
.cci-tile-cnt{font-family:var(--mono);font-size:16px;font-weight:800;color:var(--amber);line-height:1}
.cci-tile-lbl{font-size:9px;color:var(--muted2);margin-top:3px;font-weight:600}
.sitem{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px 6px 14px;cursor:pointer;transition:background .1s;
  border-left:3px solid transparent;gap:8px;
}
.sitem:hover{background:var(--surface2)}
.sitem.active{background:rgba(77,166,255,.08);border-left-color:var(--blue)}
.sitem-label{
  font-size:11px;font-weight:500;color:var(--muted2);
  line-height:1.3;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.sitem.active .sitem-label{color:var(--text);font-weight:600}
.sitem-cnt{
  font-size:9px;font-weight:700;padding:2px 6px;border-radius:8px;
  background:var(--surface3);color:var(--muted2);flex-shrink:0;
  font-family:var(--mono);min-width:26px;text-align:center;
}
.sitem.active .sitem-cnt{background:rgba(77,166,255,.15);color:var(--blue)}

/* ── MAIN CONTENT ─────────────────────────────────────────────────────────── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

.filter-bar{
  padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;
}
.chip{
  padding:4px 11px;border:1px solid var(--border);border-radius:20px;
  font-size:10px;font-weight:600;cursor:pointer;color:var(--muted2);
  background:transparent;font-family:var(--sans);transition:all .12s;
  white-space:nowrap;letter-spacing:.02em;
}
.chip:hover{border-color:var(--border2);color:var(--text);background:var(--surface2)}
.chip.active{background:var(--blue-dim);border-color:var(--blue);color:var(--blue)}
.chip.ai-buy.active{background:var(--green-dim);border-color:var(--green);color:var(--green)}
.chip.ai-watch.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber)}
.stats-line{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap}
.stats-line b{color:var(--text);font-size:11px;font-weight:700;font-family:var(--mono)}
.dl-btn{
  padding:4px 12px;border:1px solid var(--green-d);border-radius:20px;
  font-size:10px;font-weight:600;color:var(--green);background:var(--green-dim);
  font-family:var(--sans);text-decoration:none;transition:all .14s;
  white-space:nowrap;display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em;
}
.dl-btn:hover{background:var(--green);color:#040a06;border-color:var(--green)}

/* ── GRID ─────────────────────────────────────────────────────────────────── */
.grid-wrap{flex:1;overflow-y:auto;padding:14px}
.grid-wrap::-webkit-scrollbar{width:5px}
.grid-wrap::-webkit-scrollbar-track{background:transparent}
.grid-wrap::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c5{grid-template-columns:repeat(5,1fr)}

/* ── CARDS ────────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface);
  border:1px solid var(--border);border-radius:10px;
  overflow:hidden;cursor:pointer;
  transition:transform .14s,border-color .14s,box-shadow .14s;
  position:relative;display:flex;flex-direction:column;
}
.card:hover{
  border-color:var(--border2);
  box-shadow:0 4px 24px rgba(0,0,0,.45);
  transform:translateY(-1px);
}
/* Left accent stripe by pattern */
.card.pat-BREAKOUT{border-left:3px solid var(--green)}
.card.pat-VCP     {border-left:3px solid var(--amber)}
.card.pat-STAGE2  {border-left:3px solid var(--violet)}
.card.pat-NEARHIGH{border-left:3px solid var(--blue)}
.card.pat-ON20MA  {border-left:3px solid var(--orange)}
.card.pat-WATCH   {border-left:3px solid var(--border2)}
.card.pat-BREAKOUT:hover{box-shadow:0 4px 24px rgba(38,217,107,.12)}
.card.pat-VCP:hover     {box-shadow:0 4px 24px rgba(245,200,66,.10)}

.card-img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:var(--bg);flex-shrink:0}
.card-img.err{opacity:0;height:0;min-height:0}
.card-no-chart{
  width:100%;aspect-ratio:16/9;background:var(--surface2);display:none;
  align-items:center;justify-content:center;gap:6px;
  color:var(--muted);font-size:10px;letter-spacing:.06em;font-family:var(--sans);
  flex-direction:column;flex-shrink:0;
}
.card-no-chart::before{content:'⊘';font-size:22px;color:var(--border2)}

/* Overlay badges on image */
.card-badge{
  position:absolute;top:7px;left:9px;
  font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:10px;
  letter-spacing:.05em;backdrop-filter:blur(6px);text-transform:uppercase;
}
.card-ai{
  position:absolute;top:7px;right:9px;
  font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:10px;
  letter-spacing:.05em;backdrop-filter:blur(6px);
}

/* Card footer */
.card-foot{
  padding:9px 10px 9px 11px;
  display:grid;grid-template-columns:1fr auto;gap:2px;
  border-top:1px solid var(--border);align-items:center;
  background:var(--surface);
}
.card-ticker{
  font-size:13px;font-weight:700;color:var(--text);
  font-family:var(--mono);line-height:1.1;letter-spacing:-.01em;
}
.card-sub{
  font-size:9.5px;color:var(--muted2);margin-top:3px;
  font-family:var(--mono);display:flex;gap:6px;align-items:center;
}
.rs-badge{
  font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:8px;
  text-align:center;line-height:1.2;white-space:nowrap;
  font-family:var(--mono);
}
.rs-hi {background:rgba(38,217,107,.14);color:var(--green);border:1px solid rgba(38,217,107,.25)}
.rs-mid{background:rgba(245,200,66,.11);color:var(--amber);border:1px solid rgba(245,200,66,.22)}
.rs-lo {background:rgba(90,112,128,.10);color:var(--muted2);border:1px solid var(--border)}

/* Pattern badge colors */
.pb-BREAKOUT{background:rgba(38,217,107,.18);color:var(--green);border:1px solid rgba(38,217,107,.28)}
.pb-VCP     {background:rgba(245,200,66,.14);color:var(--amber);border:1px solid rgba(245,200,66,.28)}
.pb-STAGE2  {background:rgba(160,122,240,.14);color:var(--violet);border:1px solid rgba(160,122,240,.28)}
.pb-NEARHIGH{background:rgba(77,166,255,.13);color:var(--blue);border:1px solid rgba(77,166,255,.25)}
.pb-ON20MA  {background:rgba(240,128,72,.13);color:var(--orange);border:1px solid rgba(240,128,72,.25)}
.pb-WATCH   {background:rgba(70,100,122,.12);color:var(--muted2);border:1px solid var(--border)}
/* AI pill */
.ai-BUY  {background:rgba(38,217,107,.18);color:var(--green);border:1px solid rgba(38,217,107,.3)}
.ai-WATCH{background:rgba(245,200,66,.14);color:var(--amber);border:1px solid rgba(245,200,66,.3)}
.ai-AVOID{background:rgba(240,74,58,.14);color:var(--red);border:1px solid rgba(240,74,58,.3)}

.empty{padding:80px 20px;text-align:center;color:var(--muted);font-size:13px;font-weight:500}

/* ── MODAL ────────────────────────────────────────────────────────────────── */
.modal-bg{
  display:none;position:fixed;inset:0;background:rgba(2,7,12,.78);
  z-index:500;align-items:center;justify-content:center;backdrop-filter:blur(4px);
}
.modal-bg.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border2);border-radius:14px;
  width:min(900px,96vw);max-height:92vh;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 32px 80px rgba(0,0,0,.7);
}
.modal-stripe{height:3px;flex-shrink:0;background:var(--blue)}
.modal-hdr{
  padding:11px 16px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.modal-ticker{
  font-size:17px;font-weight:700;color:var(--text);
  font-family:var(--mono);letter-spacing:-.02em;
}
.modal-lbl{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px}
.modal-nav{display:flex;align-items:center;gap:4px;margin-left:auto}
.nav-btn{
  background:var(--surface2);border:1px solid var(--border);border-radius:6px;
  color:var(--muted2);padding:4px 11px;cursor:pointer;font-size:14px;
  font-family:var(--mono);transition:all .12s;line-height:1;
}
.nav-btn:hover{border-color:var(--border2);color:var(--text);background:var(--surface3)}
#m-pos{font-size:10px;color:var(--muted);padding:0 6px;font-family:var(--mono)}
.modal-close{
  background:transparent;border:1px solid var(--border);border-radius:6px;
  color:var(--muted2);padding:4px 10px;font-size:14px;cursor:pointer;
  transition:all .12s;margin-left:6px;
}
.modal-close:hover{border-color:var(--red);color:var(--red);background:var(--red-dim)}
.modal-body{display:flex;flex-direction:column;overflow:hidden;flex:1}
.modal-chart{flex-shrink:0}
.modal-chart img{
  width:100%;height:auto;display:block;background:var(--bg);
  max-height:460px;object-fit:contain;
}
.modal-meta{
  padding:12px 16px;border-top:1px solid var(--border);
  display:flex;gap:8px;flex-wrap:wrap;
  flex-shrink:0;overflow-y:auto;max-height:200px;
}
.modal-meta::-webkit-scrollbar{height:4px}
.modal-meta::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.meta-cell{
  display:flex;flex-direction:column;gap:3px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:7px;padding:6px 10px;min-width:78px;
}
.meta-lbl{
  font-size:8px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.09em;font-weight:700;
}
.meta-val{
  font-size:12px;font-weight:700;color:var(--text);
  font-family:var(--mono);letter-spacing:-.02em;
}
.meta-ai-section{
  width:100%;border-top:1px solid var(--border);margin-top:6px;padding-top:10px;
  display:flex;gap:10px;flex-wrap:wrap;
}
.ai-banner{
  width:100%;padding:8px 12px;border-radius:8px;font-size:11px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}
.ai-banner .ai-pat{font-size:13px;font-weight:800;font-family:var(--mono)}
.ai-banner .ai-note{color:var(--muted2);font-weight:400;font-size:10px}

/* ── LIVE PRICE BADGE ─────────────────────────────────────────────────────── */
#live-badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:12px;font-size:10px;font-weight:700;letter-spacing:.04em;
  border:1px solid var(--border2);color:var(--muted2);background:transparent;
  font-family:var(--mono);white-space:nowrap;transition:all .3s;flex-shrink:0;
}
#live-badge.live{border-color:var(--green);color:var(--green);background:var(--green-dim)}
#live-badge .dot{
  width:6px;height:6px;border-radius:50%;background:var(--muted2);flex-shrink:0;
  transition:background .3s;
}
#live-badge.live .dot{background:var(--green);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.card-change{font-size:9px;font-weight:700;margin-left:4px;font-family:var(--mono)}
.card-change.up{color:var(--green)}.card-change.dn{color:var(--red)}

/* ── LOADING ──────────────────────────────────────────────────────────────── */
.loading{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:80px 20px;color:var(--muted);font-size:12px;font-weight:500;
}
.spinner{
  width:18px;height:18px;border:2px solid var(--border2);
  border-top-color:var(--green);border-radius:50%;
  animation:spin .7s linear infinite;flex-shrink:0;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── RESPONSIVE ───────────────────────────────────────────────────────────── */
@media(max-width:1100px){.sidebar{width:180px}.grid{grid-template-columns:repeat(3,1fr)!important}}
@media(max-width:800px) {.sidebar{width:148px}.sitem-label{font-size:10px}.grid{grid-template-columns:repeat(2,1fr)!important}}
@media(max-width:480px) {.sidebar{display:none}.modal{width:100vw;max-height:100dvh;border-radius:0}}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">
    <div class="logo-icon">📈</div>
    <div>
      <div class="logo-text">PatternView</div>
      <div class="logo-sub">NSE · SEPA</div>
    </div>
  </div>
  <div class="market-grp">
    <button class="mtab active" id="tab-india" onclick="switchMarket('india')">India</button>
    <button class="mtab" id="tab-us"    onclick="switchMarket('us')">US</button>
  </div>
  <div class="vsep"></div>
  <div class="search-wrap">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="6.5" cy="6.5" r="5"/><line x1="10.5" y1="10.5" x2="14" y2="14"/>
    </svg>
    <input type="text" id="search-inp" placeholder="Search ticker…" oninput="applyFilter()">
  </div>
  <select class="sort-sel" id="sort-sel" onchange="applyFilter()">
    <option value="rs_rank_desc">RS Rank ↓</option>
    <option value="ai_conf_desc">AI Conf ↓</option>
    <option value="pct_from_high_desc">Near High</option>
    <option value="passed_desc">Criteria ↓</option>
    <option value="pct_from_ma20_asc">Near MA20</option>
    <option value="ticker_asc">A – Z</option>
  </select>
  <div class="topbar-right">
    <div class="col-grp">
      <button class="col-btn" data-c="2" onclick="setCols(this)">2</button>
      <button class="col-btn" data-c="3" onclick="setCols(this)">3</button>
      <button class="col-btn active" data-c="4" onclick="setCols(this)">4</button>
      <button class="col-btn" data-c="5" onclick="setCols(this)">5</button>
    </div>
  </div>
  <div id="live-badge" title="Live price feed status"><span class="dot"></span><span id="live-time">LOADING</span></div>
</div>

<!-- LAYOUT -->
<div class="app-body">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-search">
      <input type="text" id="screen-search" placeholder="Filter screens…" oninput="filterSidebar()">
    </div>
    <div class="screen-list" id="screen-list"></div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="filter-bar">
      <button class="chip active" data-f="all"     onclick="setChip(this)">All</button>
      <button class="chip" data-f="bo"             onclick="setChip(this)">Breakout</button>
      <button class="chip" data-f="vcp"            onclick="setChip(this)">VCP</button>
      <button class="chip" data-f="ma20"           onclick="setChip(this)">On 20MA</button>
      <button class="chip" data-f="rs85"           onclick="setChip(this)">RS ≥ 85</button>
      <button class="chip" data-f="full"           onclick="setChip(this)">Full Template</button>
      <button class="chip ai-buy" data-f="ai_buy"  onclick="setChip(this)">AI: BUY</button>
      <button class="chip ai-watch" data-f="ai_watch" onclick="setChip(this)">AI: WATCH</button>
      <a class="dl-btn" id="excel-dl" href="india_screens.xlsx" download>⬇ Excel</a>
      <div class="stats-line" id="stats-line"><b>—</b> stocks</div>
    </div>
    <div class="grid-wrap">
      <div class="loading" id="loading-msg"><div class="spinner"></div> Loading charts…</div>
      <div class="grid" id="grid" style="display:none"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal">
    <div class="modal-stripe" id="m-stripe"></div>
    <div class="modal-hdr">
      <span class="modal-ticker" id="m-ticker">—</span>
      <span class="modal-lbl" id="m-lbl"></span>
      <div class="modal-nav">
        <button class="nav-btn" onclick="navModal(-1)" title="Previous (←)">‹</button>
        <span id="m-pos"></span>
        <button class="nav-btn" onclick="navModal(1)"  title="Next (→)">›</button>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-chart"><img id="m-img" src="" alt=""></div>
      <div class="modal-meta" id="m-meta"></div>
    </div>
  </div>
</div>

<script>
// ── STATE ───────────────────────────────────────────────────────────────────
var market = 'india', currentScreen = null, chipFilter = 'all';
var displayedStocks = [], modalIdx = 0;
var SCREENS_INDIA = {}, SCREENS_US = {}, colCount = 4;
// Cache-bust chart images once per session (forces fresh PNG after regeneration)
var IMG_VER = '?v=' + Math.floor(Date.now() / 60000);  // changes every minute

// ── BOOT ────────────────────────────────────────────────────────────────────
Promise.all([
  fetch('india_data.json?_='+Date.now()).then(function(r){ return r.json(); }),
  fetch('us_data.json?_='+Date.now()).then(function(r){ return r.json(); })
]).then(function(res){
  SCREENS_INDIA = res[0];
  SCREENS_US    = res[1];
  document.getElementById('loading-msg').style.display = 'none';
  document.getElementById('grid').style.display = 'grid';
  // always reset to "All" filter on load
  chipFilter = 'all';
  document.querySelectorAll('.chip').forEach(function(b){ b.classList.remove('active'); });
  document.querySelector('.chip[data-f="all"]').classList.add('active');
  buildSidebar();
  var first = Object.keys(SCREENS_INDIA)[0];
  setScreen(first);
  setLastUpdated();
}).catch(function(e){
  document.getElementById('loading-msg').innerHTML =
    '<span style="color:var(--red)">Failed to load data: '+e.message+'<br>Is the HTTP server running? <code>python3 -m http.server 8765</code></span>';
});

function setLastUpdated(){
  // Try to read last-modified from JSON metadata
  var el = document.getElementById('last-upd');
  el.textContent = new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}

// ── MARKET SWITCH ────────────────────────────────────────────────────────────
function switchMarket(m){
  market = m;
  document.getElementById('tab-india').classList.toggle('active', m==='india');
  document.getElementById('tab-us').classList.toggle('active', m==='us');
  document.getElementById('excel-dl').href = m==='india' ? 'india_screens.xlsx' : 'us_screens.xlsx';
  buildSidebar();
  var first = Object.keys(m==='india'?SCREENS_INDIA:SCREENS_US)[0];
  setScreen(first);
  // Refresh live prices for the new market immediately
  LIVE_PRICES = {};
  fetchLivePrices();
}

// ── VIRTUAL SCREENS (built client-side from existing stock data) ──────────────
// Returns a synthetic screen object {label, stocks} derived from all loaded data.
function getVirtualScreen(key){
  var screens = market==='india' ? SCREENS_INDIA : SCREENS_US;
  // Deduplicate across all real screens
  var seen = {}, all = [];
  Object.values(screens).forEach(function(scr){
    (scr.stocks||[]).forEach(function(s){
      if(s.ticker && !seen[s.ticker]){ seen[s.ticker]=1; all.push(s); }
    });
  });

  if(key==='ai_picks'){
    var buys = all.filter(function(s){ return (s.ai||{}).action==='BUY'; });
    buys.sort(function(a,b){ return ((b.ai||{}).conf||0)-((a.ai||{}).conf||0); });
    return {label:'AI Minervini Picks', stocks:buys};
  }

  if(key==='ath_leaders'){
    // Stocks within 5% of all-time high, sorted by RS rank
    var leaders = all.filter(function(s){
      var v = s.pct_from_ath != null ? s.pct_from_ath : s.pct_from_high;
      return v != null && v >= -5;
    });
    leaders.sort(function(a,b){ return (b.rs_rank||0)-(a.rs_rank||0); });
    return {label:'All-Time High Leaders', stocks:leaders};
  }

  if(key==='near_high_ma20'){
    // Within 8% of 52-wk high OR 10% of ATH AND price within 5% of 20MA
    var setup = all.filter(function(s){
      var fromHigh = s.pct_from_high != null && s.pct_from_high >= -8;
      var fromAth  = (s.pct_from_ath  != null && s.pct_from_ath  >= -10) ||
                     (s.pct_from_high != null && s.pct_from_high >= -10);
      var nearMa   = s.pct_from_ma20  != null && Math.abs(s.pct_from_ma20) <= 5;
      return (fromHigh || fromAth) && nearMa;
    });
    setup.sort(function(a,b){ return (b.rs_rank||0)-(a.rs_rank||0); });
    return {label:'Near High & 20MA Setup', stocks:setup};
  }

  return null;
}

// ── SIDEBAR ──────────────────────────────────────────────────────────────────
var BASE_SCREENS  = new Set(['full_template','near_breakout','vcp_setup','high_ma20','rs_leaders','new_highs','near_base_pivot']);
var WEEKLY_SCREENS= new Set(['weekly_pivot','cci_weekly_cross','cci_weekly_above']);
var AI_SCREENS    = new Set(['ai_picks']);

function buildSidebar(filterQ){
  var screens = market==='india' ? SCREENS_INDIA : SCREENS_US;
  var q = (filterQ||'').toLowerCase();
  var baseHtml='', extraHtml='';

  // ── Pinned virtual screens (always visible, built from live data) ────────────
  function _pinnedItem(key, icon, label, color, dimColor){
    // For virtual screens use getVirtualScreen; for real screens read directly
    var scr2 = VIRTUAL_SCREENS.has(key) ? getVirtualScreen(key) : screens[key];
    var cnt  = scr2 ? (scr2.stocks||[]).length : 0;
    var act  = currentScreen===key;
    return '<div class="sitem'+(act?' active':'')+'" data-key="'+key+'" onclick="setScreen(\''+key+'\')" '
      +'style="border-left:2px solid '+color+';background:'+(act?dimColor:'transparent')+';">'
      +'<span class="sitem-label" style="color:'+color+';font-weight:700">'+icon+' '+label+'</span>'
      +'<span class="sitem-cnt" style="background:'+dimColor+';color:'+color+'">'+(cnt||'—')+'</span>'
      +'</div>';
  }
  // CCI summary tile panel
  function _cciTile(key, label, subLabel){
    var scr2 = screens[key];
    var cnt  = scr2 ? (scr2.stocks||[]).length : 0;
    var act  = currentScreen===key;
    return '<div class="cci-tile'+(act?' active':'')+'" onclick="setScreen(\''+key+'\')" title="'+label+'">'
      +'<div class="cci-tile-cnt">'+cnt+'</div>'
      +'<div class="cci-tile-lbl">'+subLabel+'</div>'
      +'</div>';
  }
  // MTF = stocks in both daily_above AND weekly_above
  var dAbove = new Set(((screens['cci_daily_above']||{}).stocks||[]).map(function(s){return s.ticker;}));
  var wAbove = new Set(((screens['cci_weekly_above']||{}).stocks||[]).map(function(s){return s.ticker;}));
  var mtfCnt = 0; dAbove.forEach(function(t){ if(wAbove.has(t)) mtfCnt++; });

  var cciPanel = '<div class="cci-panel">'
    +'<div class="cci-panel-title">CCI Live (NSE Universe)</div>'
    +'<div class="cci-tiles">'
    +'<div class="cci-tile cci-tile-mtf'+(currentScreen==='cci_daily_above'?' active':'')+'" onclick="setScreen(\'cci_daily_above\')" title="Both Daily & Weekly ≥100">'
      +'<div class="cci-tile-cnt">'+mtfCnt+'</div><div class="cci-tile-lbl">◆ MTF Both</div></div>'
    +_cciTile('cci_daily_above',  'Daily CCI ≥ 100',  '▲ Daily ≥100')
    +_cciTile('cci_weekly_above', 'Weekly CCI ≥ 100', '▲ Weekly ≥100')
    +_cciTile('cci_daily_cross',  'Daily CCI × 100',  '⚡ Daily Cross')
    +_cciTile('cci_weekly_cross', 'Weekly CCI × 100', '⚡ Weekly Cross')
    +'</div></div>';

  var aiPicksHtml =
    _pinnedItem('ath_leaders',      '🏆', 'ATH Leaders',       'var(--amber)', 'var(--amber-dim)')
  + _pinnedItem('near_high_ma20',   '🎯', 'Near High & 20MA',  'var(--teal)',  'rgba(40,201,176,.10)')
  + _pinnedItem('ai_picks',         '⚡', 'AI Picks',          'var(--green)', 'var(--green-dim)')
  + _pinnedItem('near_weekly_pivot','📅', 'Near Weekly Pivot', 'var(--blue)',  'var(--blue-dim)');

  Object.entries(screens).forEach(function(e){
    var key=e[0], scr=e[1];
    if(key==='ai_picks' || key==='near_weekly_pivot') return; // pinned above
    var label = scr.label||key;
    if(q && label.toLowerCase().indexOf(q)<0 && key.indexOf(q)<0) return;
    var isActive = key===currentScreen;
    var cnt = scr.stocks ? scr.stocks.length : 0;
    var weekly = WEEKLY_SCREENS.has(key) ? ' <span style="font-size:8px;opacity:.6">[W]</span>' : '';
    var item = '<div class="sitem'+(isActive?' active':'')+'" data-key="'+key+'" onclick="setScreen(\''+key+'\')">'
      +'<span class="sitem-label">'+label+weekly+'</span>'
      +'<span class="sitem-cnt">'+cnt+'</span>'
      +'</div>';
    if(BASE_SCREENS.has(key)) baseHtml += item;
    else                      extraHtml += item;
  });

  var html = aiPicksHtml
    + '<div style="height:1px;background:var(--border);margin:4px 0"></div>'
    + cciPanel
    + '<div style="height:1px;background:var(--border);margin:4px 0"></div>';
  if(baseHtml)  html += '<div class="screen-group">Base Screens</div>'+baseHtml;
  if(extraHtml) html += '<div class="screen-group">Pattern Screens</div>'+extraHtml;
  document.getElementById('screen-list').innerHTML = html || '<div class="empty" style="padding:20px">No screens match</div>';
}

function filterSidebar(){
  buildSidebar(document.getElementById('screen-search').value.trim());
}

function setScreen(key){
  currentScreen = key;
  buildSidebar(document.getElementById('screen-search').value.trim());
  applyFilter();
}

// ── FILTER & SORT ────────────────────────────────────────────────────────────
function setChip(btn){
  document.querySelectorAll('.chip').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  chipFilter = btn.dataset.f;
  applyFilter();
}

function setCols(btn){
  document.querySelectorAll('.col-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  colCount = +btn.dataset.c;
  var grid = document.getElementById('grid');
  grid.className = 'grid c'+colCount;
}

// Virtual screens: built client-side from aggregated data
var VIRTUAL_SCREENS = new Set(['ai_picks','ath_leaders','near_high_ma20']);

function applyFilter(){
  var screens = market==='india' ? SCREENS_INDIA : SCREENS_US;
  var scr = VIRTUAL_SCREENS.has(currentScreen)
    ? getVirtualScreen(currentScreen)
    : screens[currentScreen];
  if(!scr){ document.getElementById('grid').innerHTML = '<div class="empty">No data loaded.</div>'; return; }

  var stocks = scr.stocks.slice();
  var q = document.getElementById('search-inp').value.trim().toUpperCase();
  if(q) stocks = stocks.filter(function(s){ return (s.ticker||'').toUpperCase().indexOf(q)>=0; });

  if(chipFilter==='bo')       stocks = stocks.filter(function(s){ return s.pivot_crossed; });
  if(chipFilter==='vcp')      stocks = stocks.filter(function(s){ return s.vcp_last_daily || s.vcp_last_weekly || s.vcp; });
  if(chipFilter==='ma20')     stocks = stocks.filter(function(s){ return s.pct_from_ma20!=null&&Math.abs(s.pct_from_ma20)<=3; });
  if(chipFilter==='rs85')     stocks = stocks.filter(function(s){ return (s.rs_rank||0)>=85; });
  if(chipFilter==='full')     stocks = stocks.filter(function(s){ return s.passed===8; });
  if(chipFilter==='ai_buy')   stocks = stocks.filter(function(s){ return s.ai&&s.ai.action==='BUY'; });
  if(chipFilter==='ai_watch') stocks = stocks.filter(function(s){ return s.ai&&s.ai.action==='WATCH'; });

  var sort = document.getElementById('sort-sel').value;
  stocks.sort(function(a,b){
    if(sort==='rs_rank_desc')       return (b.rs_rank||0)-(a.rs_rank||0);
    if(sort==='ai_conf_desc')       return ((b.ai&&b.ai.conf)||0)-((a.ai&&a.ai.conf)||0);
    if(sort==='pct_from_high_desc') return (b.pct_from_high||0)-(a.pct_from_high||0);
    if(sort==='passed_desc')        return (b.passed||0)-(a.passed||0);
    if(sort==='pct_from_ma20_asc')  return Math.abs(a.pct_from_ma20||99)-Math.abs(b.pct_from_ma20||99);
    if(sort==='ticker_asc')         return (a.ticker||'').localeCompare(b.ticker||'');
    return 0;
  });

  displayedStocks = stocks;
  var aiCount = stocks.filter(function(s){ return s.ai; }).length;
  var aiNote  = aiCount ? ' · <span style="color:var(--amber)">'+aiCount+' AI</span>' : '';
  document.getElementById('stats-line').innerHTML =
    '<b>'+stocks.length+'</b> stocks'+aiNote;
  renderGrid(stocks);
}

// ── PATTERN HELPERS ──────────────────────────────────────────────────────────
function patternLabel(s){
  if(s.pivot_crossed)                                      return 'BREAKOUT';
  if(s.vcp||s.vcp_last_daily||s.vcp_last_weekly)           return 'VCP';
  if(s.pct_from_high!=null && s.pct_from_high>=-5)        return 'NEAR HIGH';
  if(s.pct_from_ma20!=null && Math.abs(s.pct_from_ma20)<=3) return 'ON 20MA';
  if(s.passed===8)                                         return 'STAGE 2';
  return 'WATCH';
}
var PAT_CLS = {BREAKOUT:'pb-BREAKOUT',VCP:'pb-VCP','NEAR HIGH':'pb-NEARHIGH',
               'ON 20MA':'pb-ON20MA','STAGE 2':'pb-STAGE2',WATCH:'pb-WATCH'};

// ── RENDER GRID ──────────────────────────────────────────────────────────────
var WEEKLY_CHART_SCREENS = new Set(['near_weekly_pivot','weekly_pivot','cci_weekly_cross','cci_weekly_above']);
function renderGrid(stocks){
  var cur       = market==='india' ? '₹' : '$';
  var imgDir    = market==='india' ? 'charts_india' : 'charts_us';
  var useWeekly = WEEKLY_CHART_SCREENS.has(currentScreen);
  if(!stocks.length){
    if(currentScreen==='ai_picks'){
      document.getElementById('grid').innerHTML =
        '<div class="empty" style="text-align:center;padding:60px 20px">'
        +'<div style="font-size:28px;margin-bottom:12px">⚡</div>'
        +'<div style="font-size:13px;color:var(--text);margin-bottom:6px">No AI Picks yet</div>'
        +'<div style="font-size:11px;color:var(--muted)">Run AI analysis to generate Minervini picks:<br>'
        +'<code style="background:var(--surface2);padding:2px 6px;border-radius:3px;margin-top:8px;display:inline-block">'
        +'python3.10 run_daily.py</code></div>'
        +'</div>';
    } else if(currentScreen==='near_weekly_pivot'){
      document.getElementById('grid').innerHTML =
        '<div class="empty" style="text-align:center;padding:60px 20px">'
        +'<div style="font-size:13px;color:var(--muted)">No stocks within 8% of weekly pivot</div></div>';
    } else {
      document.getElementById('grid').innerHTML = '<div class="empty">No stocks match the current filter.</div>';
    }
    return;
  }

  // AI Picks screen: special trade-card layout
  if(currentScreen==='ai_picks'){
    renderAIPicks(stocks, cur, imgDir);
    return;
  }

  var html = '';
  stocks.forEach(function(s, idx){
    var lbl    = patternLabel(s);
    var cls    = PAT_CLS[lbl]||'pb-WATCH';
    var price  = s.price!=null ? cur+(+s.price).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
    var pctH   = s.pct_from_high!=null ? (s.pct_from_high>0?'+':'')+s.pct_from_high.toFixed(1)+'%' : '';
    var hcol   = s.pct_from_high!=null&&s.pct_from_high>=-5 ? 'var(--green)' : 'var(--muted2)';
    var imgBase = s.ticker + (useWeekly ? '_W' : '') + '.png';
    var imgSrc  = imgDir + '/' + imgBase + IMG_VER;
    // Weekly pivot badge
    var wPivHtml = '';
    if(useWeekly && s.pivot_high_w){
      var pctW = s.pct_from_pivot_w!=null ? (s.pct_from_pivot_w>=0?'+':'')+s.pct_from_pivot_w.toFixed(1)+'%' : '';
      wPivHtml = '<span style="position:absolute;bottom:28px;left:8px;background:rgba(77,166,255,.14);'
        +'border:1px solid rgba(77,166,255,.5);color:var(--blue);font-size:8px;font-weight:700;'
        +'padding:2px 7px;border-radius:8px;font-family:var(--mono);letter-spacing:.03em;backdrop-filter:blur(4px)">'
        +'W-Piv '+cur+(+s.pivot_high_w).toLocaleString('en')+(pctW?' · '+pctW:'')+'</span>';
    }
    // AI pill
    var aiHtml = '';
    if(s.ai&&s.ai.action){
      aiHtml = '<span class="card-ai ai-'+s.ai.action+'">'+s.ai.action
        +(s.ai.conf?' '+s.ai.conf+'%':'')+'</span>';
    }
    var patKey = lbl.replace(' ',''); // e.g. 'NEAR HIGH' -> 'NEARHIGH'
    var rsNum  = +(s.rs_rank||0);
    var rsCls  = rsNum>=85 ? 'rs-hi' : rsNum>=70 ? 'rs-mid' : 'rs-lo';
    html += '<div class="card pat-'+patKey+'" data-ticker="'+s.ticker+'" onclick="openModal('+idx+')">'
      +'<img class="card-img" src="'+imgSrc+'" alt="'+s.ticker+'" loading="lazy" onerror="this.classList.add(\'err\');var p=this.nextElementSibling;if(p)p.style.display=\'flex\'">'
      +'<div class="card-no-chart">No chart data</div>'
      +'<span class="card-badge '+cls+'">'+lbl+'</span>'
      +aiHtml
      +wPivHtml
      +'<div class="card-foot">'
        +'<div>'
          +'<div class="card-ticker">'+s.ticker+'</div>'
          +'<div class="card-sub live-price">'+price+'<span style="color:'+hcol+';margin-left:5px">'+pctH+'</span></div>'
        +'</div>'
        +'<div class="rs-badge '+rsCls+'">RS&nbsp;'+rsNum+'</div>'
      +'</div>'
      +'</div>';
  });
  document.getElementById('grid').innerHTML = html;
  // Apply any already-loaded live prices immediately after grid rebuild
  if(Object.keys(LIVE_PRICES).length) refreshLivePricesInGrid();
}

// ── AI PICKS RENDERER ────────────────────────────────────────────────────────
function renderAIPicks(stocks, cur, imgDir){
  var fmt = function(v,d){ return v!=null?(+v).toLocaleString('en',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):'-'; };
  var c   = function(v){ return v!=null?cur+fmt(v,2):'-'; };
  var rr  = function(s){
    var ai=s.ai||{};
    if(!ai.entry||!ai.stop||!ai.target) return null;
    var risk=Math.abs(ai.entry-ai.stop);
    var reward=Math.abs(ai.target-ai.entry);
    return risk>0?(reward/risk).toFixed(1)+'R':null;
  };
  var colAct={'BUY':'var(--green)','WATCH':'var(--amber)','AVOID':'var(--red)'};

  var html='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;padding:16px">';
  stocks.forEach(function(s,idx){
    var ai=s.ai||{};
    var ac=ai.action||'WATCH';
    var aCol=colAct[ac]||'var(--muted2)';
    var rrVal=rr(s);
    var price=s.price!=null?cur+fmt(s.price,2):'—';
    var imgSrc=imgDir+'/'+(s.img||s.ticker+'.png')+IMG_VER;
    var confBar=ai.conf?'<div style="height:3px;background:var(--border2);border-radius:2px;margin:6px 0 8px"><div style="height:100%;width:'+ai.conf+'%;background:'+aCol+';border-radius:2px;transition:width .4s"></div></div>':'';

    html+='<div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color .15s" onclick="openModal('+idx+')" onmouseover="this.style.borderColor=\''+aCol+'\'" onmouseout="this.style.borderColor=\'var(--border)\'">'

      // Chart thumbnail strip
      +'<div style="position:relative;height:130px;overflow:hidden;background:var(--bg)">'
        +'<img src="'+imgSrc+'" alt="'+s.ticker+'" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display=\'none\'">'
        +'<div style="position:absolute;inset:0;background:linear-gradient(transparent 50%,var(--surface) 100%)"></div>'
        +'<div style="position:absolute;top:8px;left:10px;font-family:\'SF Mono\',monospace;font-size:14px;font-weight:800;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)">'+s.ticker+'</div>'
        +'<div style="position:absolute;top:8px;right:10px;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;background:'+aCol+'22;border:1px solid '+aCol+';color:'+aCol+'">'+ac+(ai.conf?' · '+ai.conf+'%':'')+'</div>'
        +'<div style="position:absolute;bottom:8px;left:10px;font-size:10px;color:var(--muted2)">'+(ai.pattern||'')+'</div>'
      +'</div>'

      // Trade details
      +'<div style="padding:12px 14px">'
        +confBar
        +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-bottom:10px">'
          +'<div style="text-align:center">'
            +'<div style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Price</div>'
            +'<div style="font-size:12px;font-weight:700;color:var(--text);font-family:\'SF Mono\',monospace">'+price+'</div>'
          +'</div>'
          +'<div style="text-align:center;border-left:1px solid var(--border)">'
            +'<div style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Entry</div>'
            +'<div style="font-size:12px;font-weight:700;color:var(--blue);font-family:\'SF Mono\',monospace">'+(ai.entry?cur+fmt(ai.entry,2):'-')+'</div>'
          +'</div>'
          +'<div style="text-align:center;border-left:1px solid var(--border)">'
            +'<div style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Stop</div>'
            +'<div style="font-size:12px;font-weight:700;color:var(--red);font-family:\'SF Mono\',monospace">'+(ai.stop?cur+fmt(ai.stop,2):'-')+'</div>'
          +'</div>'
          +'<div style="text-align:center;border-left:1px solid var(--border)">'
            +'<div style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px">Target</div>'
            +'<div style="font-size:12px;font-weight:700;color:var(--green);font-family:\'SF Mono\',monospace">'+(ai.target?cur+fmt(ai.target,2):'-')+'</div>'
          +'</div>'
        +'</div>'

        // R:R badge + entry rule
        +(rrVal?'<div style="display:inline-block;padding:2px 7px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:4px;font-size:9px;font-weight:700;color:var(--blue);margin-bottom:6px">R:R '+rrVal+'</div>':'' )
        +(ai.entry_rule?'<div style="font-size:10px;color:var(--text);padding:6px 8px;background:var(--bg);border-left:2px solid '+aCol+';border-radius:2px;margin-bottom:6px">'+ai.entry_rule+'</div>':'')
        +(ai.note?'<div style="font-size:10px;color:var(--muted2)">'+ai.note+'</div>':'')

        // Footer
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">'
          +'<div style="font-size:9px;color:var(--muted)">RS <span style="color:var(--text);font-weight:700">'+(s.rs_rank||'—')+'</span>&nbsp;&nbsp;'
            +(s.passed!=null?'Criteria <span style="color:var(--text);font-weight:700">'+s.passed+'/8</span>':'')+'</div>'
          +(ai.vision?'<span style="font-size:9px;color:var(--muted)">👁 Visual'+(ai.rag?' · 📚 RAG':'')+'</span>':'')
        +'</div>'
      +'</div>'
    +'</div>';
  });
  html+='</div>';
  document.getElementById('grid').innerHTML=html;
}

// ── MODAL ────────────────────────────────────────────────────────────────────
function openModal(idx){
  modalIdx = idx;
  _renderModal();
  document.getElementById('modal-bg').classList.add('open');
}

function _renderModal(){
  var s      = displayedStocks[modalIdx];
  if(!s) return;
  var cur    = market==='india' ? '₹' : '$';
  var imgDir = market==='india' ? 'charts_india' : 'charts_us';
  var lbl    = patternLabel(s);
  var cls    = PAT_CLS[lbl]||'pb-WATCH';

  document.getElementById('m-ticker').textContent = s.ticker;
  var lblEl = document.getElementById('m-lbl');
  lblEl.textContent  = lbl;
  lblEl.className    = 'modal-lbl '+cls;
  // Color the top stripe — AI action wins, else pattern color
  var stripeCol = {BREAKOUT:'var(--green)',VCP:'var(--amber)','NEAR HIGH':'var(--blue)',
                   'ON 20MA':'var(--orange)','STAGE 2':'var(--violet)',WATCH:'var(--border2)'}[lbl]||'var(--border2)';
  if(s.ai&&s.ai.action) stripeCol = {BUY:'var(--green)',WATCH:'var(--amber)',AVOID:'var(--red)'}[s.ai.action]||stripeCol;
  document.getElementById('m-stripe').style.background = stripeCol;
  var useWeeklyModal = WEEKLY_CHART_SCREENS.has(currentScreen);
  document.getElementById('m-img').src = imgDir+'/'+(s.img||(s.ticker+(useWeeklyModal?'_W':'')+'.png'))+IMG_VER;
  document.getElementById('m-pos').textContent = (modalIdx+1)+' / '+displayedStocks.length;

  var fmt = function(v,d){ return v!=null?(+v).toLocaleString('en',{minimumFractionDigits:d||0,maximumFractionDigits:d||0}):'—'; };
  var pct = function(v){ return v!=null?(v>0?'+':'')+v.toFixed(1)+'%':'—'; };
  // Use live price if available, fall back to scanner price
  var lp      = LIVE_PRICES[s.ticker];
  var liveP   = lp ? lp.price : s.price;
  var liveChg = lp ? ' <span style="font-size:11px;color:'+(lp.change_pct>=0?'var(--green)':'var(--red)')+'">('+(lp.change_pct>=0?'+':'')+lp.change_pct.toFixed(2)+'%)</span>' : '';
  var rows = [
    {l:'Price',     v: liveP!=null?(cur+fmt(liveP,2)+liveChg):'—'},
    {l:'RS Rank',   v: s.rs_rank||'—'},
    {l:'Criteria',  v: (s.passed||'?')+'/8'},
    {l:'From High', v: pct(s.pct_from_high)},
    {l:'From 20MA', v: pct(s.pct_from_ma20)},
    {l:'From MA50', v: pct(s.pct_from_ma50)},
    {l:'Pivot',     v: s.pivot_high!=null?cur+fmt(s.pivot_high,0):'—'},
    {l:'Vol Ratio', v: s.vol_ratio!=null?s.vol_ratio.toFixed(2)+'×':'—'},
  ];

  var metaHtml = rows.map(function(r){
    return '<div class="meta-cell"><div class="meta-lbl">'+r.l+'</div><div class="meta-val">'+r.v+'</div></div>';
  }).join('');

  // AI section
  if(s.ai){
    var ac  = s.ai.action||'WATCH';
    var aCol= {BUY:'var(--green)',WATCH:'var(--amber)',AVOID:'var(--red)'}[ac]||'var(--muted2)';
    var aCls= 'ai-'+ac;
    var aiSrc = (s.ai.vision?'👁 Visual':'📊 Text') + (s.ai.rag?' + 📚 Book RAG':'');
    metaHtml += '<div class="meta-ai-section">'
      +'<div style="font-size:9px;color:var(--muted);margin-bottom:4px;letter-spacing:.04em">MINERVINI AI · '+aiSrc+'</div>'
      +'<div class="ai-banner '+aCls+'" style="background:'+aCol+'15;border:1px solid '+aCol+'44">'
        +'<span class="ai-pat">'+(s.ai.pattern||'')+'</span>'
        +(s.ai.conf?'<span style="font-size:11px;opacity:.7">&nbsp;'+s.ai.conf+'%</span>':'')
        +'<span style="margin-left:auto;font-weight:800;color:'+aCol+'">'+ac+'</span>'
      +'</div>'
      +(s.ai.entry_rule?'<div style="margin-top:6px;padding:6px 8px;background:var(--bg2);border-left:2px solid var(--blue);border-radius:3px;font-size:10px;color:var(--text)"><span style="color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.06em">Entry Rule · </span>'+s.ai.entry_rule+'</div>':'')
      +(s.ai.note?'<div style="margin-top:5px;font-size:10px;color:var(--muted2)">'+s.ai.note+'</div>':'')
      +'<div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">'
      +(s.ai.support?'<div class="meta-cell"><div class="meta-lbl">AI Support</div><div class="meta-val" style="color:var(--green)">'+cur+fmt(s.ai.support,0)+'</div></div>':'')
      +(s.ai.resistance?'<div class="meta-cell"><div class="meta-lbl">AI Resist.</div><div class="meta-val" style="color:var(--red)">'+cur+fmt(s.ai.resistance,0)+'</div></div>':'')
      +(s.ai.date?'<div class="meta-cell"><div class="meta-lbl">AI Date</div><div class="meta-val" style="color:var(--muted2)">'+s.ai.date+'</div></div>':'')
      +'</div>'
      +'</div>';
  }

  document.getElementById('m-meta').innerHTML = metaHtml;
}

function navModal(dir){
  modalIdx = Math.max(0, Math.min(displayedStocks.length-1, modalIdx+dir));
  _renderModal();
}

function closeModal(){
  document.getElementById('modal-bg').classList.remove('open');
}

// Keyboard navigation
document.addEventListener('keydown', function(e){
  var open = document.getElementById('modal-bg').classList.contains('open');
  if(e.key==='Escape') closeModal();
  if(open && e.key==='ArrowLeft')  navModal(-1);
  if(open && e.key==='ArrowRight') navModal(1);
});

// ── LIVE PRICE FEED ──────────────────────────────────────────────────────────
var LIVE_PRICES    = {};       // ticker → {price, prev_close, change_pct, change_abs}
var _lastLiveEtag  = '';       // detect file changes without re-parsing identical data
var _liveFailCount = 0;

function fetchLivePrices(){
  var file = (market === 'us') ? 'live_prices_us.json' : 'live_prices.json';
  fetch(file + '?_=' + Date.now())
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    })
    .then(function(data){
      _liveFailCount = 0;
      LIVE_PRICES = data.prices || {};
      var badge  = document.getElementById('live-badge');
      var ltime  = document.getElementById('live-time');
      var open   = data.market_open;
      badge.className = open ? 'live' : '';
      var timeStr = data.updated_str || '';
      ltime.textContent = open
        ? ('● LIVE  ' + timeStr)
        : ('CLOSED · ' + timeStr);
      refreshLivePricesInGrid();
    })
    .catch(function(){
      _liveFailCount++;
      var badge = document.getElementById('live-badge');
      var ltime = document.getElementById('live-time');
      if(_liveFailCount >= 3){
        badge.className = '';
        ltime.textContent = 'OFFLINE';
      }
    });
}

function refreshLivePricesInGrid(){
  var cur = (market==='us') ? '$' : '₹';
  document.querySelectorAll('.card[data-ticker]').forEach(function(card){
    var ticker = card.getAttribute('data-ticker');
    var lp = LIVE_PRICES[ticker];
    if(!lp) return;
    var sub = card.querySelector('.live-price');
    if(!sub) return;
    var p    = lp.price;
    var chg  = lp.change_pct;
    var chgCls = chg >= 0 ? 'up' : 'dn';
    var chgStr = (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%';
    var priceStr = cur + (+p).toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
    sub.innerHTML = priceStr
      + '<span class="card-change '+chgCls+'"> '+chgStr+'</span>';
    // Also update the in-memory screen data so modal shows correct price
    var screens = market==='india' ? SCREENS_INDIA : SCREENS_US;
    Object.values(screens).forEach(function(scr){
      (scr.stocks||[]).forEach(function(s){
        if(s.ticker===ticker){ s.price=p; s._live_chg=chg; }
      });
    });
  });
}

function startLiveFeed(){
  var badge = document.getElementById('live-badge');
  var ltime = document.getElementById('live-time');
  // Initial state
  if(isMarketHours()){
    badge.className = 'live';
    ltime.textContent = '● LIVE  —';
  } else {
    badge.className = '';
    ltime.textContent = 'CLOSED';
  }
  fetchLivePrices();                        // immediate first fetch
  setInterval(fetchLivePrices, 30000);      // then every 30 s
}

// Start feed after initial data load (hooked from boot promise)
var _origBuildSidebar = buildSidebar;
buildSidebar = function(){
  _origBuildSidebar.apply(this, arguments);
  // Only init once
  if(!window._liveFeedStarted){
    window._liveFeedStarted = true;
    startLiveFeed();
    startScreenRefresh();
  }
};

// ── SCREEN DATA AUTO-REFRESH (every 5 min) ───────────────────────────────────
function refreshScreenData(){
  Promise.all([
    fetch('india_data.json?_='+Date.now()).then(function(r){ return r.json(); }),
    fetch('us_data.json?_='+Date.now()).then(function(r){ return r.json(); })
  ]).then(function(res){
    SCREENS_INDIA = res[0];
    SCREENS_US    = res[1];
    // Rebuild current view with fresh screen data
    var savedScreen = currentScreen;
    buildSidebar();
    if(savedScreen) setScreen(savedScreen);
  }).catch(function(){});  // silently ignore network errors
}

function startScreenRefresh(){
  setInterval(refreshScreenData, 5 * 60 * 1000);  // every 5 min
}
</script>
